name: 'Setup Node.js and AWS CDK CLI'
description: 'Install Node.js and AWS CDK CLI globally'
author: 'Infiquetra LLC'

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22.23.4'
  cdk-version:
    description: 'Exact AWS CDK CLI version to install'
    required: false
    default: '2.1144.0'

outputs:
  node-version:
    description: 'Node.js version that was installed'
    value: ${{ steps.setup-node.outputs.node-version }}
  cdk-version:
    description: 'AWS CDK CLI version that was installed'
    value: ${{ steps.install-cdk.outputs.cdk-version }}

runs:
  using: 'composite'
  steps:
    - name: 🟢 Set up Node.js
      id: setup-node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: 🏗️ Install AWS CDK CLI
      id: install-cdk
      shell: bash
      env:
        CI_CDK_VERSION: ${{ inputs.cdk-version }}
      run: |
        if [[ ! "$CI_CDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo 'cdk-version requires an exact numeric version' >&2
          exit 1
        fi
        npm install -g "aws-cdk@$CI_CDK_VERSION"

        # Get CDK version for output
        CDK_VERSION=$(cdk --version | cut -d' ' -f1)
        test "$CDK_VERSION" = "$CI_CDK_VERSION"
        echo "cdk-version=$CDK_VERSION" >> "$GITHUB_OUTPUT"
        echo "✅ Installed AWS CDK CLI version: $CDK_VERSION"
