name: 'Setup Python with uv'
description: 'Install pinned Python and uv with locked dependency downloads'
author: 'Infiquetra LLC'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.13.16'

outputs:
  python-version:
    description: 'Python version that was installed'
    value: ${{ steps.setup-python.outputs.python-version }}
  uv-version:
    description: 'uv version that was installed'
    value: ${{ steps.install-uv.outputs.uv-version }}
  cache-hit:
    description: 'Whether the cache was hit'
    value: ${{ steps.cache-deps.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: 🐍 Set up Python
      id: setup-python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: ⚡ Install uv
      id: install-uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        version: '0.13.6'
        enable-cache: 'false'

    - name: Require root lock and locate uv downloads
      id: uv-cache
      shell: bash
      run: |
        test -f uv.lock
        test -f pyproject.toml
        echo "path=$(uv cache dir)" >> "$GITHUB_OUTPUT"

    - name: 📦 Cache uv downloads
      id: cache-deps
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.uv-cache.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ steps.install-uv.outputs.uv-version }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}

    - name: 📦 Install dependencies with uv
      shell: bash
      env:
        UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        UV_PYTHON_DOWNLOADS: never
      run: |
        uv sync --frozen --dev
        echo "✅ Dependencies installed successfully"
