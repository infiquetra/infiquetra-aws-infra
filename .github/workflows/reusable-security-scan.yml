name: Security Scanning

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.13.16'
      working-directory:
        description: 'Working directory for scans'
        required: false
        type: string
        default: '.'
      upload-sarif:
        description: 'Upload SARIF results to GitHub Security'
        required: false
        type: boolean
        default: false
    outputs:
      security-findings-count:
        description: 'Total number of security findings'
        value: ${{ jobs.security-scan.outputs.findings-count }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    outputs:
      findings-count: ${{ steps.count-findings.outputs.total }}

    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ inputs.python-version }}

      - name: 🔧 Install security tools
        run: |
          pip install semgrep==1.183.0
          echo "✅ Installed security scanning tools"

      # Valid findings remain advisory; execution/report failures fail the job.
      - name: 🔒 Run bandit security scan
        id: bandit
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.working-directory }}
        run: uv run --frozen python "$GITHUB_WORKSPACE/tools/ci_scanners.py" bandit

      - name: 🔍 Run semgrep security scan
        id: semgrep
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.working-directory }}
        run: uv run --frozen python "$GITHUB_WORKSPACE/tools/ci_scanners.py" semgrep

      - name: 📊 Count total findings
        id: count-findings
        if: always()
        working-directory: ${{ inputs.working-directory }}
        env:
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
        run: uv run --frozen python "$GITHUB_WORKSPACE/tools/ci_scanners.py" source-summary

      - name: 📤 Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            ${{ inputs.working-directory }}/bandit-report.json
            ${{ inputs.working-directory }}/semgrep-report.json
            ${{ inputs.working-directory }}/bandit-execution.json
            ${{ inputs.working-directory }}/bandit-scope.json
            ${{ inputs.working-directory }}/semgrep-execution.json
            ${{ inputs.working-directory }}/semgrep-scope.json
            ${{ inputs.working-directory }}/bandit-scanner.log
            ${{ inputs.working-directory }}/semgrep-scanner.log
            ${{ inputs.working-directory }}/bandit-version.log
            ${{ inputs.working-directory }}/semgrep-version.log
          if-no-files-found: warn
