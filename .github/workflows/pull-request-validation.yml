name: Pull Request Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CDK_DEFAULT_ACCOUNT: "645166163764"
  CDK_DEFAULT_REGION: "us-east-1"
  GITHUB_REPO: "infiquetra-aws-infra"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  code-quality:
    name: 🧹 Code Quality
    uses: ./.github/workflows/reusable-code-quality.yml
    with:
      python-version: '3.13.16'
    permissions:
      contents: read

  security-scan:
    name: 🔒 Security Scanning
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      python-version: '3.13.16'
      upload-sarif: false
    permissions:
      contents: read
      security-events: write

  cdk-synthesis:
    name: 🏗️ CDK Synthesis
    needs: [code-quality]
    uses: ./.github/workflows/reusable-cdk-synthesis.yml
    with:
      python-version: '3.13.16'
      node-version: '22.23.4'
      cdk-account: '645166163764'
      cdk-region: 'us-east-1'
    permissions:
      contents: read

  monitoring-iam:
    name: 🔎 Monitoring IAM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEIMDALL_MONITORING_MANAGEMENT_ACCOUNT_ID: '645166163764'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.13.16'

      - name: 🟢 Setup Node.js and CDK CLI
        uses: ./.github/actions/setup-node-cdk
        with:
          node-version: '22.23.4'

      - name: 🧪 Test monitoring role boundaries
        run: uv run pytest tests/unit/test_heimdall_monitoring_stack.py

      - name: 🏗️ Synthesize monitoring stacks
        run: uv run cdk -a 'python3 app_heimdall_monitoring.py' synth --all --quiet

      - name: 🔍 Lint monitoring templates
        run: uv run cfn-lint cdk.out/HeimdallMonitoring*.template.json

  nonprod-role-ci-guards:
    name: Nonprod deploy-role CI guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Test exact role, workflow and change-set guards
        env:
          PYTHONPATH: .:github-oidc-bootstrap
        run: uv run --frozen pytest tests/unit/test_nonprod_deploy_roles_ci.py tests/unit/test_nonprod_role_bootstrap_ci.py github-oidc-bootstrap/tests/unit/test_github_oidc_stack.py
      - name: Synthesize only the nonproduction deploy-role stack
        run: uv run --frozen npx -y aws-cdk@2.1144.0 synth --app 'python3 app_campps_nonprod_roles_ci.py' CamppsNonProdDeployRolesStack --quiet

  unit-tests:
    name: 🧪 Offline Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.13.16'
      - name: Verify reviewed dependency files
        id: verify-dependencies
        # The shared setup runs uv sync; reject any manifest or lock rewrite.
        run: git diff --exit-code -- pyproject.toml uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Test the complete offline unit suite
        id: unit-tests
        run: uv run --frozen python -m pytest tests/unit/

  validation-summary:
    name: 📋 Validation Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, cdk-synthesis, monitoring-iam, nonprod-role-ci-guards, unit-tests]
    if: always()

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📊 Generate validation summary
        env:
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          SECURITY_SCAN_RESULT: ${{ needs.security-scan.result }}
          CDK_SYNTHESIS_RESULT: ${{ needs.cdk-synthesis.result }}
          MONITORING_IAM_RESULT: ${{ needs.monitoring-iam.result }}
          NONPROD_ROLE_CI_GUARDS_RESULT: ${{ needs.nonprod-role-ci-guards.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          QUALITY_STATUS: ${{ needs.code-quality.outputs.quality-status }}
          SECURITY_FINDINGS_COUNT: ${{ needs.security-scan.outputs.security-findings-count }}
          SYNTHESIS_STATUS: ${{ needs.cdk-synthesis.outputs.synthesis-status }}
          TEMPLATE_COUNT: ${{ needs.cdk-synthesis.outputs.template-count }}
          VALIDATION_SHA: ${{ github.sha }}
          VALIDATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          VALIDATION_ACTOR: ${{ github.actor }}
        run: |
          {
            echo '# 🎯 Pull Request Validation Summary'
            echo ""
            echo "## Results"
            echo ""

            # Code Quality
            if [[ "$QUALITY_STATUS" == "pass" ]]; then
              echo "✅ **Code Quality**: All checks passed"
            else
              echo "❌ **Code Quality**: Some checks failed"
            fi

            # Security Scan
            if [[ "$SECURITY_SCAN_RESULT" != "success" ]]; then
              echo "❌ **Security Scan**: Validation failed"
            elif [[ "$SECURITY_FINDINGS_COUNT" == "0" ]]; then
              echo "✅ **Security Scan**: No issues found"
            else
              printf '%s\n' "⚠️ **Security Scan**: $SECURITY_FINDINGS_COUNT finding(s) detected (review artifacts)"
            fi

            # CDK Synthesis
            if [[ "$SYNTHESIS_STATUS" == "pass" ]]; then
              printf '%s\n' "✅ **CDK Synthesis**: Successful ($TEMPLATE_COUNT template(s) generated)"
            else
              echo "❌ **CDK Synthesis**: Failed"
            fi

            # Monitoring IAM
            if [[ "$MONITORING_IAM_RESULT" == "success" ]]; then
              echo "✅ **Monitoring IAM**: Tests, synthesis, and lint passed"
            else
              echo "❌ **Monitoring IAM**: Validation failed"
            fi

            # Nonproduction deploy-role CI guards
            if [[ "$NONPROD_ROLE_CI_GUARDS_RESULT" == "success" ]]; then
              echo "✅ **Nonprod deploy-role CI guards**: Tests and synthesis passed"
            else
              echo "❌ **Nonprod deploy-role CI guards**: Validation failed"
            fi

            # Complete offline unit suite
            if [[ "$UNIT_TESTS_RESULT" == "success" ]]; then
              echo "✅ **Offline Unit Tests**: Complete suite passed"
            else
              echo "❌ **Offline Unit Tests**: Validation failed"
            fi

            echo ""
            echo '## 📝 Details'
            echo ""
            printf '%s\n' "**Commit**: $VALIDATION_SHA"
            printf '%s\n' "**Branch**: $VALIDATION_BRANCH"
            printf '%s\n' "**Triggered by**: $VALIDATION_ACTOR"
            echo ""

            # Overall status
            if [[ "$CODE_QUALITY_RESULT" == "success" ]] && \
               [[ "$SECURITY_SCAN_RESULT" == "success" ]] && \
               [[ "$CDK_SYNTHESIS_RESULT" == "success" ]] && \
               [[ "$MONITORING_IAM_RESULT" == "success" ]] && \
               [[ "$NONPROD_ROLE_CI_GUARDS_RESULT" == "success" ]] && \
               [[ "$UNIT_TESTS_RESULT" == "success" ]]; then
              echo "---"
              echo ""
              echo '### 🚀 Ready for merge and deployment!'
            else
              echo "---"
              echo ""
              echo "### ⚠️ Please address the issues above before merging"
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
