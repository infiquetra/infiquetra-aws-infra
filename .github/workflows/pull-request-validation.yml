name: Pull Request Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CDK_DEFAULT_ACCOUNT: "645166163764"
  CDK_DEFAULT_REGION: "us-east-1"
  GITHUB_REPO: "infiquetra-aws-infra"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  code-quality:
    name: 🧹 Code Quality
    uses: ./.github/workflows/reusable-code-quality.yml
    with:
      python-version: '3.13'
    permissions:
      contents: read

  security-scan:
    name: 🔒 Security Scanning
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      python-version: '3.13'
      upload-sarif: false
    permissions:
      contents: read
      security-events: write

  cdk-synthesis:
    name: 🏗️ CDK Synthesis
    needs: [code-quality]
    uses: ./.github/workflows/reusable-cdk-synthesis.yml
    with:
      python-version: '3.13'
      node-version: '18'
      cdk-account: '645166163764'
      cdk-region: 'us-east-1'
    permissions:
      contents: read

  monitoring-iam:
    name: 🔎 Monitoring IAM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEIMDALL_MONITORING_MANAGEMENT_ACCOUNT_ID: '645166163764'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python with uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.13'

      - name: 🟢 Setup Node.js and CDK CLI
        uses: ./.github/actions/setup-node-cdk
        with:
          node-version: '18'

      - name: 🧪 Test monitoring role boundaries
        run: uv run pytest tests/unit/test_heimdall_monitoring_stack.py

      - name: 🏗️ Synthesize monitoring stacks
        run: uv run cdk -a 'python3 app_heimdall_monitoring.py' synth --all --quiet

      - name: 🔍 Lint monitoring templates
        run: uv run cfn-lint cdk.out/HeimdallMonitoring*.template.json

  nonprod-role-ci-guards:
    name: Nonprod deploy-role CI guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test exact role, workflow and change-set guards
        env:
          PYTHONPATH: .:github-oidc-bootstrap
        run: uv run --frozen pytest tests/unit/test_nonprod_deploy_roles_ci.py tests/unit/test_nonprod_role_bootstrap_ci.py github-oidc-bootstrap/tests/unit/test_github_oidc_stack.py
      - name: Synthesize only the nonproduction deploy-role stack
        run: uv run --frozen npx -y aws-cdk@2.1144.0 synth --app 'python3 app_campps_nonprod_roles_ci.py' CamppsNonProdDeployRolesStack --quiet

  unit-tests:
    name: 🧪 Offline Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.13'
      - name: Verify reviewed dependency files
        id: verify-dependencies
        # The shared setup runs uv sync; reject any manifest or lock rewrite.
        run: git diff --exit-code -- pyproject.toml uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test the complete offline unit suite
        id: unit-tests
        run: uv run --frozen pytest tests/unit/

  validation-summary:
    name: 📋 Validation Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, cdk-synthesis, monitoring-iam, nonprod-role-ci-guards, unit-tests]
    if: always()

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📊 Generate validation summary
        run: |
          echo "# 🎯 Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Code Quality
          if [[ "${{ needs.code-quality.outputs.quality-status }}" == "pass" ]]; then
            echo "✅ **Code Quality**: All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Some checks failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Security Scan
          FINDINGS="${{ needs.security-scan.outputs.security-findings-count }}"
          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "❌ **Security Scan**: Validation failed" >> $GITHUB_STEP_SUMMARY
          elif [[ "$FINDINGS" == "0" ]]; then
            echo "✅ **Security Scan**: No issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Security Scan**: $FINDINGS finding(s) detected (review artifacts)" >> $GITHUB_STEP_SUMMARY
          fi

          # CDK Synthesis
          if [[ "${{ needs.cdk-synthesis.outputs.synthesis-status }}" == "pass" ]]; then
            TEMPLATES="${{ needs.cdk-synthesis.outputs.template-count }}"
            echo "✅ **CDK Synthesis**: Successful ($TEMPLATES template(s) generated)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CDK Synthesis**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Monitoring IAM
          if [[ "${{ needs.monitoring-iam.result }}" == "success" ]]; then
            echo "✅ **Monitoring IAM**: Tests, synthesis, and lint passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Monitoring IAM**: Validation failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Nonproduction deploy-role CI guards
          if [[ "${{ needs.nonprod-role-ci-guards.result }}" == "success" ]]; then
            echo "✅ **Nonprod deploy-role CI guards**: Tests and synthesis passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Nonprod deploy-role CI guards**: Validation failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Complete offline unit suite
          if [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "✅ **Offline Unit Tests**: Complete suite passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Offline Unit Tests**: Validation failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.head_ref || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [[ "${{ needs.code-quality.result }}" == "success" ]] && \
             [[ "${{ needs.security-scan.result }}" == "success" ]] && \
             [[ "${{ needs.cdk-synthesis.result }}" == "success" ]] && \
             [[ "${{ needs.monitoring-iam.result }}" == "success" ]] && \
             [[ "${{ needs.nonprod-role-ci-guards.result }}" == "success" ]] && \
             [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Ready for merge and deployment!" >> $GITHUB_STEP_SUMMARY
          else
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Please address the issues above before merging" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
