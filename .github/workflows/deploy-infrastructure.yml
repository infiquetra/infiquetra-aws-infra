name: Deploy Infrastructure

on:
  push:
    branches: [ main ]
    # These files belong to the separately deployed Heimdall monitoring app.
    # Ignore the workflow edits too so their monitoring-only merge cannot
    # trigger the foundation Organization and SSO stacks.
    paths-ignore:
      - 'app_heimdall_monitoring.py'
      - 'infiquetra_aws_infra/heimdall_monitoring_stack.py'
      - 'tests/unit/test_heimdall_monitoring_stack.py'
      - 'docs/engineering-journal/DECISIONS.md'
      - 'docs/engineering-journal/LEARNINGS.md'
      - 'docs/engineering-journal/README.md'
      - '.github/workflows/deploy-infrastructure.yml'
      - '.github/workflows/pull-request-validation.yml'
      - 'tests/unit/test_pr_validation_ci.py'
      # Exact CI scanner paths do not change management-account infrastructure.
      - '.github/workflows/reusable-security-scan.yml'
      - '.github/workflows/reusable-cdk-synthesis.yml'
      - 'tools/ci_scanners.py'
      - 'tools/ci_scanner_plan.py'
      - 'tests/unit/test_ci_scanner_scope.py'
      - 'tests/unit/test_ci_scanners.py'
      # These quality/test paths are not used by foundation deployment.
      - '.github/workflows/reusable-code-quality.yml'
      - 'tests/unit/test_workflow_parser_compat.py'
      # Separate CAMPPS deploy-role changes do not modify the management app.
      - '.github/workflows/deploy-campps-nonprod-roles.yml'
      - '.github/workflows/bootstrap-campps-nonprod-roles.yml'
      - 'app_campps_nonprod_roles_ci.py'
      - 'infiquetra_aws_infra/campps_deploy_roles_stack.py'
      - 'tools/__init__.py'
      - 'tools/nonprod_deploy_roles_ci.py'
      - 'tools/nonprod_role_bootstrap_ci.py'
      - 'tests/unit/test_campps_deploy_roles_stack.py'
      - 'tests/unit/test_nonprod_deploy_roles_ci.py'
      - 'tests/unit/test_nonprod_role_bootstrap_ci.py'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Foundation deployment label; stacks deploy from the management account'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - nonprod
          - staging
      stack:
        description: 'Stack to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - organization
          - sso

env:
  CDK_DEFAULT_ACCOUNT: "645166163764"
  CDK_DEFAULT_REGION: "us-east-1"
  GITHUB_REPO: "infiquetra-aws-infra"

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy to AWS
    # Only deploy from main branch
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-aws-deployment.yml
    permissions:
      id-token: write
      contents: write
    with:
      environment: ${{ inputs.environment || 'production' }}
      stack: ${{ inputs.stack || 'all' }}
      aws-account: '645166163764'
      aws-region: 'us-east-1'
      # Require approval for production, auto-approve for nonprod/staging
      require-approval: ${{ (inputs.environment == 'production' || inputs.environment == '') && false || false }}
      python-version: '3.13.16'
      node-version: '22.23.4'
    secrets:
      aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

  post-deployment:
    name: 📊 Post-Deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    permissions:
      contents: read

    steps:
      - name: 📊 Deployment results
        env:
          CI_DEPLOYMENT_STATUS: ${{ needs.deploy.outputs.deployment-status }}
          CI_DEPLOYMENT_TAG: ${{ needs.deploy.outputs.deployment-tag }}
          CI_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          CI_STACK: ${{ inputs.stack || 'all' }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_ACTOR: ${{ github.actor }}
        run: |
          echo '# 🎯 Deployment Results' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          STATUS="$CI_DEPLOYMENT_STATUS"
          TAG="$CI_DEPLOYMENT_TAG"

          if [[ "$STATUS" == "success" ]]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment label**: $CI_ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
            echo "**Stack**: $CI_STACK" >> $GITHUB_STEP_SUMMARY

            if [[ "$TAG" != "" ]]; then
              echo "**Tag**: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            fi
          elif [[ "$STATUS" == "failure" ]]; then
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the deployment logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ℹ️ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No deployment was performed." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: $CI_COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: $CI_ACTOR" >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
