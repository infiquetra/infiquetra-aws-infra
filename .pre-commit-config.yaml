repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check, --diff]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        exclude: ^github-oidc-bootstrap/
        additional_dependencies:
          - boto3-stubs[essential]>=1.26.0
          - types-requests>=2.28.0
          - pytest>=8.4.1
          - types-pyyaml>=6.0.12.20260518

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [--configfile, pyproject.toml, --format, json]
        exclude: ^(tests/|github-oidc-bootstrap/tests/)
        additional_dependencies: ["pbr", "bandit[toml]"]


